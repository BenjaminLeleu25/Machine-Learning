[project]
name = "..."
version = "1.0.0"
description = "\"Package for learning the basics of machine learning\""
authors = [
    {name = "BenjaminLeleu25",email = "benji.leleu9@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "scikit-learn (>=1.7.2,<2.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "statsmodels (>=0.14.5,<0.15.0)",
    "numpy (>=1.22.0,<3.0.0)",
    "scipy (>=1.8.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
